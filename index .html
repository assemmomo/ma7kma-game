 if(S.tab==="timeline"){var items=[];function addTimeline(text,source){var re=/([01]?\d|2[0-3]):([0-5]\d)/g,m;while((m=re.exec(text))!==null){items.push({time:m[0],mins:(+m[1])*60+(+m[2]),text:text,source:source});break}}addTimeline(c.report,"تقرير الواقعة");c.evidence.forEach(function(e){addTimeline(e.title+": "+e.text,e.title)});c.suspects.forEach(function(p){addTimeline(p.name+": "+p.statement,"أقوال المتهمين")});c.witnesses.forEach(function(w){addTimeline(w.name+": "+w.statement,"الشهود")});items.sort(function(a,b){return a.mins-b.mins});h+='<div class="card"><h2>⏱️ الخط الزمني للأحداث</h2><p class="mut">الأوقات المستخرجة من التقرير والأدلة والأقوال. قارن بينها لاكتشاف التناقضات؛ بعض الأوقات قد تكون تقديرية أو غير مؤكدة.</p><div class="timeline">'+(items.length?items.map(function(x){return '<div class="tl-item"><div class="tl-time">'+esc(x.time)+' · '+esc(x.source)+'</div><div>'+esc(x.text)+'</div></div>'}).join(""):'<p>لا توجد توقيتات رقمية كافية في هذه القضية.</p>')+'</div></div>';}
 if(S.tab==="sus")h+=c.suspects.map(function(s){return '<div class="card sus"><div class="av">'+esc(s.name.replace("د. ","").charAt(0))+'</div><h2>'+esc(s.name)+' <span class="tag">'+esc(s.job)+'، '+esc(s.age)+' سنة</span></h2><p><b>الدافع المحتمل:</b> '+esc(s.motive)+'</p><p><b>روايته:</b> '+esc(s.statement)+'</p><p class="mut">الانطباع: '+esc(s.demeanor)+'</p></div>'}).join("");
 if(S.tab==="wit")h+=c.witnesses.map(function(w){return '<div class="card wit"><h2>🗣️ '+esc(w.name)+' <span class="tag">'+esc(w.relation)+'</span></h2><p>'+esc(w.statement)+'</p></div>'}).join("");
 if(S.tab==="int"){var ppl=c.suspects.concat(c.witnesses);h+='<div class="card"><p>اختر شخصًا ثم سؤالًا:</p>'+ppl.map(function(p){return '<button class="'+(S.who===p.id?"on":"")+'" data-w="'+p.id+'">'+esc(p.name)+' ('+(S.asked[p.id]||[]).length+'/3)</button>'}).join("");
  if(S.who){var ak=S.asked[S.who]||[],left=3-ak.length;h+='<hr><p class="mut">متبقي لك <b>'+left+'</b> من 3 أسئلة لهذا الشخص</p>'+c.qs[S.who].map(function(q,i){return '<button data-q="'+i+'"'+(ak.indexOf(i)>=0||left<=0?" disabled":"")+'>'+esc(q)+'</button>'}).join("")+'<div>'+(S.asked[S.who]||[]).map(function(i){return '<div class="q"><b>'+esc(c.qs[S.who][i])+'</b><br>'+esc(c.answers[S.who][i])+'<br><button class="pin" data-pin="'+esc(ppl.filter(function(p){return p.id===S.who})[0].name+" - "+c.qs[S.who][i]+": "+c.answers[S.who][i])+'">📌 إلى ملاحظاتي</button></div>'}).join("")+'</div><hr><h3>🧩 مواجهة الشخص بدليل</h3><p class="mut">اختر دليلًا مرتبطًا بكلام الشخص، ثم واجهه به. المواجهة تسجل في ملف التحقيق وتساعدك على تنظيم استنتاجاتك.</p><div class="challenge"><select id="challengeEv">'+c.evidence.map(function(e,i){return '<option value="'+i+'">دليل '+(i+1)+': '+esc(e.title)+'</option>'}).join("")+'</select><button class="p" id="challengeBtn">واجه بالدليل</button></div>'+(S.confrontations&&S.confrontations[S.who]?S.confrontations[S.who].map(function(x){return '<div class="q"><b>المواجهة: '+esc(c.evidence[x.e].title)+'</b><br>'+esc(x.reply)+'</div>'}).join(""):'')}h+='</div>'}
 if(S.tab==="ver")h+=verdictHtml();
 h+='<button class="fab" id="nb">📝 ملاحظاتي'+(S.notes?" •":"")+'</button><div class="sheet'+(S.open?" show":"")+'"><div class="sh"><b>📝 دفتر ملاحظاتي</b><button id="nx">✕</button></div><textarea id="nt" placeholder="سجّل تناقضاتك وشكوكك هنا…">'+esc(S.notes)+'</textarea></div>';$("app").innerHTML=h;
 $("nb").onclick=function(){S.open=!S.open;draw()};$("nx").onclick=function(){S.open=false;draw()};$("nt").oninput=function(){S.notes=this.value;try{localStorage.setItem("n_"+S.c.title,S.notes)}catch(e){}saveSession()};
 document.querySelectorAll("[data-pin]").forEach(function(b){b.onclick=function(){S.notes+=(S.notes?"\n":"")+"• "+b.dataset.pin;try{localStorage.setItem("n_"+S.c.title,S.notes)}catch(e){}S.open=true;draw()}});
 document.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){S.tab=b.dataset.t;draw()}});
 document.querySelectorAll("[data-w]").forEach(function(b){b.onclick=function(){S.who=b.dataset.w;draw()}});
 document.querySelectorAll("[data-q]").forEach(function(b){b.onclick=function(){var a=S.asked[S.who]=S.asked[S.who]||[];var i=+b.dataset.q;if(a.indexOf(i)<0&&a.length<3)a.push(i);draw()}});
 if(S.tab==="ver")bindVerdict();var cb=$("challengeBtn");if(cb)cb.onclick=function(){var ei=+$ ("challengeEv").value;var person=c.suspects.concat(c.witnesses).filter(function(p){return p.id===S.who})[0];var related=(c.evidence[ei].text+" "+c.evidence[ei].title).indexOf(person.name)>=0;var reply=related?"الدليل يذكر هذا الشخص بالاسم، لكنه لا يكفي وحده لإثبات الذنب. قارنه بالتوقيتات وبقية الأدلة قبل الحكم.":"الدليل لا يربط هذا الشخص مباشرةً من النص المتاح. ابحث عن سجل أو شهادة مستقلة قبل اعتباره دليل إدانة.";S.confrontations=S.confrontations||{};S.confrontations[S.who]=S.confrontations[S.who]||[];S.confrontations[S.who].push({e:ei,reply:reply});S.notes+=(S.notes?"\n":"")+"• مواجهة "+person.name+" بدليل "+c.evidence[ei].title+": "+reply;try{localStorage.setItem("n_"+S.c.title,S.notes)}catch(e){}draw()};saveSession()}
function verdictHtml(){var c=S.c;if(S.done)return resultHtml();
 return '<div class="card"><h2>من الجاني؟</h2><p class="mut">قد يكون في القضية جانٍ واحد أو اثنان. اختر حتى 2.</p>'+c.suspects.map(function(s){return '<label><input type="checkbox" data-g="'+s.id+'"'+(S.pick[s.id]?" checked":"")+'> '+esc(s.name)+' ('+esc(s.job)+')</label>'}).join("")+'</div><div class="card"><h2>الأدلة التي تثبت حكمك</h2>'+c.evidence.map(function(e,i){return '<label><input type="checkbox" data-e="'+i+'"'+(S.ev[i]?" checked":"")+'> '+esc(e.title)+'</label>'}).join("")+'</div><button class="p" id="go">أصدر الحكم</button>'}
function bindVerdict(){document.querySelectorAll("[data-g]").forEach(function(r){r.onchange=function(){if(r.checked&&Object.keys(S.pick).filter(function(k){return S.pick[k]}).length>=2){r.checked=false;alert("الحد الأقصى متهمان");return}S.pick[r.dataset.g]=r.checked;saveSession()}});document.querySelectorAll("[data-e]").forEach(function(k){k.onchange=function(){S.ev[k.dataset.e]=k.checked;saveSession()}});var g=$("go");if(g)g.onclick=function(){if(!Object.keys(S.pick).some(function(k){return S.pick[k]})){alert("اختر المتهم أولًا");return}S.done=true;mark();draw()};var n=$("next");if(n)n.onclick=function(){pickDiff()}}
function resultHtml(){var c=S.c,t=c.truth,cu=t.culpritIds,pk=Object.keys(S.pick).filter(function(k){return S.pick[k]}),hit=pk.filter(function(k){return cu.indexOf(k)>=0}).length,wrong=pk.length-hit,ok=hit===cu.length&&wrong===0;
 var chosen=Object.keys(S.ev).filter(function(k){return S.ev[k]}).map(Number),good=chosen.filter(function(i){return t.keyEvidence.indexOf(i)>=0}).length;
 var evS=Math.round(30*good/t.keyEvidence.length)-Math.min(10,(chosen.length-good)*5);evS=Math.max(0,evS);
 var asked=Object.keys(S.asked).reduce(function(a,k){return a+S.asked[k].length},0),cul=cu.reduce(function(a,k){return a+(S.asked[k]||[]).length},0);
 var inv=Math.min(20,Math.round(10*Math.min(1,asked/8))+Math.round(5*Math.min(1,cul/(2*cu.length)))+Math.round(5*Math.min(1,Object.keys(S.seen).length/5)));
 var acc=Math.max(0,Math.round(50*hit/cu.length)-15*wrong),hasKey=chosen.some(function(i){return t.keyEvidence.indexOf(i)>=0});ok=ok&&hasKey;S.sc=acc+evS+inv;
 var cn=c.suspects.filter(function(s){return cu.indexOf(s.id)>=0}).map(function(s){return s.name}).join(" و ");
 var inn=c.suspects.filter(function(s){return cu.indexOf(s.id)<0}).map(function(s){return '<li>'+esc(s.name)+': '+esc((t.innocentNotes||{})[s.id]||"بريء")+'</li>'}).join("");
 var ke=t.keyEvidence.map(function(i){return '<li>'+esc(c.evidence[i].title)+'</li>'}).join("");
 return '<div class="card"><h2 class="'+(ok?"ok":"bad")+'">'+(ok?"حكم صائب ✅":(hit?"حكم ناقص أو فيه اتهام بريء ⚠️":"حكم خاطئ ❌"))+'</h2><p><b>الجاني/الجناة الحقيقيون:</b> '+esc(cn)+'</p><p>'+esc(t.explanation)+'</p><p><b>الأدلة الحاسمة:</b></p><ul>'+ke+'</ul><p><b>الأبرياء:</b></p><ul>'+inn+'</ul></div><div class="card"><h2>تقييمك: '+S.sc+' / 100</h2><p>دقة الحكم: '+acc+'/50<br>استخدام الأدلة: '+evS+'/30<br>التحقيق وكشف التناقضات: '+inv+'/20</p><p class="mut">'+(ok&&t.keyEvidence.some(function(i){return chosen.indexOf(i)>=0})?"أحسنت أيها القاضي! حُسبت القضية منجزة لأنك اتهمت الجاني الصحيح واستندت إلى دليل حاسم.":"لم تُحتسب هذه القضية منجزة. يلزم تحديد الجاني الصحيح واختيار دليل حاسم واحد على الأقل، وستعود إليك القضية لتحاول مجددًا.")+'</p><button class="p" id="next">'+"قضية جديدة"+'</button></div>'}
if(!resumeSession())home();
